model:
  d_model: 128
  nhead: 4
  num_layers_fine: 3
  num_layers_coarse: 4
  dropout: 0.025
  max_seq_len: 200
  num_h3_nodes: 500
  # Seasonal latent dictionary (WildGraph-style)
  num_latent_entries: 16   # K latent movement-mode prototypes per season
  num_seasons: 2           # dry, wet

diffusion:
  T: 200
  S: 40
  beta_start: 0.0001
  beta_end: 0.02

data:
  window_size: 24
  stride: 12
  gap_threshold_sec: 300
  train_frac: 0.8
  val_frac: 0.1

training:
  epochs: 300
  batch_size: 512
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  checkpoint_dir: checkpoints/coarse/
  log_every: 100

h3:
  initial_zoom: 4
  split_threshold: 1.0
  node2vec_dim: 64
  eco_dim: 16
  walk_length: 40
  num_walks: 200
  q: 4
