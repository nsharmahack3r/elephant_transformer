model:
  d_model: 256
  nhead: 8
  num_layers: 6
  dropout: 0.1
  max_seq_len: 200

diffusion:
  T: 200
  S: 40
  beta_start: 0.0001
  beta_end: 0.02

data:
  window_size: 200
  stride: 100
  gap_threshold_sec: 300
  val_elephant: AG005
  test_elephant: null

training:
  epochs: 200
  batch_size: 256
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  checkpoint_dir: checkpoints/fine/
  log_every: 100

loss:
  lambda_kinematic: 0.1
  lambda_ecological: 0.05
  warmup_aux_epoch: 20

h3:
  initial_zoom: 4
  split_threshold: 1.0
  node2vec_dim: 64
  eco_dim: 16
  walk_length: 40
  num_walks: 200
  q: 4
